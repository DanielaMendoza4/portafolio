<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portafolio personal de Daniela del Carmen Mendoza Jaimes, estudiante de Ingeniería de Software con Inteligencia Artificial en SENATI."
    />
    <meta name="author" content="Daniela del Carmen Mendoza Jaimes" />
    <meta name="theme-color" content="#f7f4ef" />

    <!-- Tipografías: Fraunces (títulos) + Inter (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Daniela Mendoza · Portafolio</title>

    <!-- Evita el parpadeo de tema (FOUC) antes de que React monte -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem('tema');
          var prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var tema = guardado || (prefiereOscuro ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', tema);
        } catch (e) {
          /* sin localStorage: se queda en claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
